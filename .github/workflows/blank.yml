name: Construire l'APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v7

      - name: Décompresser le projet
        run: |
          if [ -f projet.zip ]; then unzip -o -q projet.zip && echo "projet.zip décompressé"; fi

      - name: Vérifier les fichiers du projet
        run: |
          # Si les fichiers ont été déposés dans un sous-dossier, on les ramène à la racine
          if [ ! -f package.json ]; then
            f=$(find . -name capacitor.config.json -not -path "./node_modules/*" | head -1)
            if [ -n "$f" ]; then
              d=$(dirname "$f"); echo "Projet trouvé dans $d : copie à la racine"; cp -r "$d"/. .
            fi
          fi
          echo "Fichiers présents :"; ls -la
          manque=0
          for f in package.json capacitor.config.json www/index.html www/jszip.min.js native/MainActivity.java native/debug.keystore assets/icon-only.png; do
            if [ ! -f "$f" ]; then echo "::error::Fichier manquant dans le dépôt : $f"; manque=1; fi
          done
          if [ "$manque" = 1 ]; then
            echo "::error::Le fichier projet.zip est absent du dépôt. Déposez-le avec Add file > Upload files."
            exit 1
          fi

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les outils Android
        uses: android-actions/setup-android@v4

      - name: Installer Capacitor
        run: npm install --no-audit --no-fund

      - name: Créer le projet Android
        run: npx cap add android

      - name: Garder l'écran allumé
        run: cp native/MainActivity.java android/app/src/main/java/fr/maison/tableaudebord/MainActivity.java

      - name: Générer l'icône et l'écran de démarrage
        run: npx capacitor-assets generate --android --iconBackgroundColor "#0B1226" --splashBackgroundColor "#0B1226" --splashBackgroundColorDark "#0B1226"

      - name: Copier la page dans l'application
        run: npx cap sync android

      - name: Utiliser toujours la même signature
        run: |
          mkdir -p ~/.android
          cp native/debug.keystore ~/.android/debug.keystore

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Mettre l'APK à disposition
        uses: actions/upload-artifact@v7
        with:
          name: tableau-de-bord-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
